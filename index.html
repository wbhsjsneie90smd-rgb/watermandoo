<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>물만두 - 나만의 커리어 포트폴리오</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .brand-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-container h1 {
            font-size: 48px;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .brand-container h1 span {
            color: #3b82f6;
        }

        .brand-container p {
            font-size: 16px;
            color: #64748b;
        }

        .card {
            width: 100%;
            max-width: 400px;
            background-color: #ffffff;
            padding: 36px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            color: #1e293b;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
        }

        .form-group input:focus {
            border-color: #3b82f6;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-login {
            background-color: #3b82f6;
            color: #ffffff;
            margin-top: 8px;
            margin-bottom: 12px;
        }

        .btn-login:hover {
            background-color: #2563eb;
        }

        .btn-signup {
            background-color: #ffffff;
            color: #475569;
            border: 1px solid #cbd5e1;
        }

        .btn-signup:hover {
            background-color: #f1f5f9;
            color: #0f172a;
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            color: #94a3b8;
            font-size: 13px;
            position: relative;
        }

        .divider::before, .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background-color: #e2e8f0;
        }

        .divider::before { left: 0; }
        .divider::after { right: 0; }
    </style>
</head>
<body>

    <div class="brand-container">
        <h1>물<span>만두</span></h1>
        <p>나만의 커리어 포트폴리오를 쉽고 빠르게 만들어보세요</p>
    </div>

    <div class="card">
        <form>
            <div class="form-group">
                <label for="username">아이디</label>
                <input type="text" id="username" placeholder="아이디를 입력하세요" required>
            </div>

            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" placeholder="비밀번호를 입력하세요" required>
            </div>

            <button type="submit" class="btn btn-login">로그인</button>
        </form>

        <div class="divider">또는</div>

        <button type="button" class="btn btn-signup" onclick="alert('회원가입 기능은 준비 중입니다!')">회원가입하기</button>
    </div>

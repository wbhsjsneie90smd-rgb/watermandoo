<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>물만두 - 나만의 색깔로 물들이는 커리어 아카이브</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #fdf4ff 0%, #fae8ff 50%, #f3e8ff 100%);
            color: #4a5568;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }
        .bubble-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; overflow: hidden; z-index: 0;
        }
        .bubble {
            position: absolute; bottom: -50px;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8), rgba(216, 180, 254, 0.3));
            border-radius: 50%;
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.7), 0 0 10px rgba(168, 85, 247, 0.2);
            animation: floatUp 8s infinite ease-in-out; opacity: 0.6;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
            20% { opacity: 0.7; }
            80% { opacity: 0.7; }
            100% { transform: translateY(-110vh) translateX(50px) scale(1.1); opacity: 0; }
        }
        .brand-container { text-align: center; margin-bottom: 25px; z-index: 10; cursor: pointer; }
        .brand-container h1 { font-size: 48px; font-weight: 700; color: #581c87; letter-spacing: -1px; margin-bottom: 6px; }
        .brand-container h1 span { color: #d946ef; }
        .brand-container p { font-size: 15px; color: #7e22ce; font-weight: 400; }
        .card {
            width: 100%; max-width: 460px;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(14px); padding: 35px; border-radius: 24px;
            box-shadow: 0 12px 35px rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(233, 213, 255, 0.7); z-index: 10; position: relative;
        }
        .card.wide { max-width: 750px; max-height: 85vh; overflow-y: auto; }
        .card.wide::-webkit-scrollbar { width: 6px; }
        .card.wide::-webkit-scrollbar-thumb { background-color: #d8b4fe; border-radius: 10px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; color: #6b21a8; margin-bottom: 6px; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 12px 16px; background-color: #faf5ff;
            border: 1px solid #e9d5ff; border-radius: 12px; color: #4a5568; font-size: 14px; outline: none;
        }
        .form-group textarea { resize: vertical; min-height: 90px; }
        .form-group input:focus, .form-group textarea:focus {
            border-color: #c084fc; background-color: #ffffff; box-shadow: 0 0 0 4px rgba(192, 132, 252, 0.15);
        }
        .hint { font-size: 11px; color: #9333ea; margin-top: 4px; margin-left: 4px; opacity: 0.8; }
        .btn { width: 100%; padding: 13px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; border: none; }
        .btn-primary { background: linear-gradient(135deg, #c084fc 0%, #e879f9 100%); color: #ffffff; margin-top: 8px; margin-bottom: 10px; }
        .btn-secondary { background-color: #ffffff; color: #7e22ce; border: 1px solid #e9d5ff; }
        .btn-accent { background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%); color: white; }
        .divider { text-align: center; margin: 16px 0; color: #a855f7; font-size: 13px; position: relative; opacity: 0.7; }
        .divider::before, .divider::after { content: ""; position: absolute; top: 50%; width: 36%; height: 1px; background-color: #e9d5ff; }
        .divider::before { left: 0; }
        .divider::after { right: 0; }
        .hidden { display: none !important; }
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: center; z-index: 1000;
            opacity: 0; visibility: hidden; transition: all 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-card { background: #ffffff; width: 90%; max-width: 340px; padding: 24px; border-radius: 20px; text-align: center; }
        .modal-message { font-size: 15px; color: #334155; margin-bottom: 20px; line-height: 1.5; }
        .modal-btn { background: #a855f7; color: white; border: none; padding: 10px 24px; border-radius: 10px; font-weight: 600; cursor: pointer; width: 100%; }
        .portfolio-view { text-align: left; }
        .portfolio-header { border-bottom: 2px solid #f3e8ff; padding-bottom: 16px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .profile-flex { display: flex; align-items: center; gap: 16px; }
        .profile-img-preview { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 2px solid #d8b4fe; background-color: #faf5ff; }
        .portfolio-header h2 { font-size: 24px; color: #581c87; font-weight: 700; }
        .section-box { background: #faf5ff; border: 1px solid #e9d5ff; border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        .section-box h3 { font-size: 15px; color: #7e22ce; margin-bottom: 8px; }
        .tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
        .tag { background: #f3e8ff; color: #7e22ce; padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 500; }
    </style>
</head>
<body>

    <div class="bubble-container" id="bubble-container"></div>

    <div class="brand-container" onclick="goHome()">
        <h1>물<span>만두</span></h1>
        <p>나만의 색깔로 물들이는 커리어 아카이브</p>
    </div>

    <div class="card" id="main-card">
        <div id="login-section">
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>아이디</label>
                    <input type="text" id="login-id" placeholder="아이디를 입력하세요" required>
                </div>
                <div class="form-group">
                    <label>비밀번호</label>
                    <input type="password" id="login-pw" placeholder="비밀번호를 입력하세요" required>
                </div>
                <button type="submit" class="btn btn-primary">로그인</button>
            </form>
            <div class="divider">계정이 없으신가요?</div>
            <button type="button" class="btn btn-secondary" onclick="switchView('signup')">회원가입하기</button>
        </div>

        <div id="signup-section" class="hidden">
            <form onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label>아이디</label>
                    <input type="text" id="signup-id" placeholder="영문, 숫자 조합" required>
                    <div class="hint">영문, 숫자 포함 9~15자</div>
                </div>
                <div class="form-group">
                    <label>비밀번호</label>
                    <input type="password" id="signup-pw" placeholder="영문, 숫자, 특수문자 조합" required>
                    <div class="hint">영문, 숫자, 특수문자 포함 9~15자</div>
                </div>
                <div class="form-group">
                    <label>이름</label>
                    <input type="text" id="signup-name" placeholder="이름을 입력하세요" required>
                </div>
                <button type="submit" class="btn btn-primary">가입 완료하기</button>
            </form>
            <button type="button" class="btn btn-secondary" onclick="switchView('login')" style="margin-top: 10px;">로그인으로 돌아가기</button>
        </div>

        <div id="welcome-portfolio-section" class="hidden" style="text-align: center;">
            <h2 id="welcome-title" style="font-size: 22px; color: #581c87; margin-bottom: 10px;">환영합니다! 🎉</h2>
            <p style="color: #7e22ce; margin-bottom: 24px; font-size: 14px;">아직 등록된 포트폴리오가 없습니다. 나만의 커리어를 채워보세요!</p>
            <button type="button" class="btn btn-accent" onclick="openPortfolioFormWithBubbleEffect()" style="padding: 16px;">✨ 포트폴리오 생성하기</button>
            <button type="button" class="btn btn-secondary" onclick="handleLogout()" style="margin-top: 12px;">로그아웃</button>
        </div>

        <div id="portfolio-form-section" class="hidden">
            <h2 style="font-size: 20px; color: #581c87; margin-bottom: 16px; text-align: center;">📝 커리어 포트폴리오 작성</h2>
            <form onsubmit="handleSavePortfolio(event)">
                <div class="form-group">
                    <label>프로필 사진 (이미지 URL)</label>
                    <input type="text" id="pf-image" placeholder="예: https://example.com/photo.jpg">
                </div>
                <div class="form-group">
                    <label>이름</label>
                    <input type="text" id="pf-name" required>
                </div>
                <div class="form-group">
                    <label>포지션</label>
                    <input type="text" id="pf-job" placeholder="예: 프론트엔드 개발자" required>
                </div>
                <div class="form-group">
                    <label>연락처</label>
                    <input type="text" id="pf-contact" required>
                </div>
                <div class="form-group">
                    <label>한줄 소개</label>
                    <input type="text" id="pf-intro" required>
                </div>
                <div class="form-group">
                    <label>보유 기술 (쉼표 구분)</label>
                    <input type="text" id="pf-skills" required>
                </div>
                <div class="form-group">
                    <label>경력 사항</label>
                    <textarea id="pf-experience"></textarea>
                </div>
                <div class="form-group">
                    <label>학력 및 교육</label>
                    <textarea id="pf-education"></textarea>
                </div>
                <div class="form-group">
                    <label>프로젝트</label>
                    <textarea id="pf-projects"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">저장하기</button>
                <button type="button" class="btn btn-secondary" onclick="cancelPortfolioForm()" style="margin-top: 6px;">취소</button>
            </form>
        </div>

        <div id="portfolio-view-section" class="hidden portfolio-view">
            <div class="portfolio-header">
                <div class="profile-flex">
                    <img id="view-profile-img" src="" alt="" class="profile-img-preview" style="display:none;">
                    <div>
                        <h2 id="view-name"></h2>
                        <div id="view-job" style="color:#d946ef; font-weight:600; margin-top:2px;"></div>
                        <div id="view-intro" style="color:#64748b; font-size:13px; margin-top:4px;"></div>
                    </div>
                </div>
                <button type="button" class="btn btn-secondary" onclick="handleLogout()" style="width:auto; padding:8px 14px;">로그아웃</button>
            </div>
            <div class="section-box"><h3>📞 연락처</h3><p id="view-contact"></p></div>
            <div class="section-box"><h3>💡 기술 스택</h3><div class="tag-list" id="view-skills-tags"></div></div>
            <div class="section-box"><h3>💼 경력 사항</h3><p id="view-experience"></p></div>
            <div class="section-box"><h3>🎓 학력 및 교육</h3><p id="view-education"></p></div>
            <div class="section-box"><h3>🚀 프로젝트</h3><p id="view-projects"></p></div>
            <button type="button" class="btn btn-secondary" onclick="openPortfolioForm()" style="margin-top:10px;">수정하기</button>
        </div>
    </div>

    <div class="modal-overlay" id="custom-modal">
        <div class="modal-card">
            <div class="modal-message" id="modal-msg"></div>
            <button class="modal-btn" onclick="closeModal()">확인</button>
        </div>
    </div>

    <script>
        function initBubbles() {
            const container = document.getElementById('bubble-container');
            for (let i = 0; i < 15; i++) {
                const bubble = document.createElement('div');
                bubble.classList.add('bubble');
                const size = Math.random() * 40 + 15;
                bubble.style.width = `${size}px`;
                bubble.style.height = `${size}px`;
                bubble.style.left = `${Math.random() * 100}%`;
                bubble.style.animationDuration = `${Math.random() * 6 + 6}s`;
                container.appendChild(bubble);
            }
        }
        function goHome() {
            const user = localStorage.getItem('mulmandu_logged_in');
            if (user) { checkUserSession(JSON.parse(user)); } else { switchView('login'); }
        }
        function showModal(msg, cb) {
            document.getElementById('modal-msg').innerText = msg;
            document.getElementById('custom-modal').classList.add('active');
            window.modalCallback = cb;
        }
        function closeModal() {
            document.getElementById('custom-modal').classList.remove('active');
            if (window.modalCallback) { window.modalCallback(); window.modalCallback = null; }
        }
        function switchView(name) {
            ['login-section', 'signup-section', 'welcome-portfolio-section', 'portfolio-form-section', 'portfolio-view-section'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            const card = document.getElementById('main-card');
            card.classList.remove('wide');
            if (name === 'login') document.getElementById('login-section').classList.remove('hidden');
            else if (name === 'signup') document.getElementById('signup-section').classList.remove('hidden');
            else if (name === 'welcome') document.getElementById('welcome-portfolio-section').classList.remove('hidden');
            else if (name === 'form') { document.getElementById('portfolio-form-section').classList.remove('hidden'); card.classList.add('wide'); }
            else if (name === 'portfolio-view') { document.getElementById('portfolio-view-section').classList.remove('hidden'); card.classList.add('wide'); }
        }
        function handleSignup(e) {
            e.preventDefault();
            const id = document.getElementById('signup-id').value.trim();
            const pw = document.getElementById('signup-pw').value.trim();
            const name = document.getElementById('signup-name').value.trim();
            if (!/^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{9,15}$/.test(id)) {
                showModal('아이디는 영문, 숫자 조합 9~15자여야 합니다.'); return;
            }
            if (!/^(?=.*[A-Za-z])(?=.*\d)(?=.*[!@#$%^&*()\-_=+\\\|\[\]{};:\'",.<>/?])[A-Za-z\d!@#$%^&*()\-_=+\\\|\[\]{};:\'",.<>/?]{9,15}$/.test(pw)) {
                showModal('비밀번호는 영문, 숫자, 특수문자 포함 9~15자여야 합니다.'); return;
            }
            let users = JSON.parse(localStorage.getItem('mulmandu_users') || '[]');
            if (users.some(u => u.id === id)) { showModal('이미 존재하는 아이디입니다.'); return; }
            users.push({ id, pw, name });
            localStorage.setItem('mulmandu_users', JSON.stringify(users));
            showModal('회원가입 완료! 로그인해주세요.', () => switchView('login'));
        }
        function handleLogin(e) {
            e.preventDefault();
            const id = document.getElementById('login-id').value.trim();
            const pw = document.getElementById('login-pw').value.trim();
            const users = JSON.parse(localStorage.getItem('mulmandu_users') || '[]');
            const user = users.find(u => u.id === id && u.pw === pw);
            if (!user) { showModal('아이디 또는 비밀번호가 틀렸습니다.'); return; }
            localStorage.setItem('mulmandu_logged_in', JSON.stringify(user));
            checkUserSession(user);
        }
        function checkUserSession(user) {
            const portfolios = JSON.parse(localStorage.getItem('mulmandu_portfolios') || '{}');
            if (portfolios[user.id]) { renderPortfolio(portfolios[user.id]); switchView('portfolio-view'); }
            else { document.getElementById('welcome-title').innerText = `${user.name} 님 환영합니다! 🎉`; switchView('welcome'); }
        }
        function openPortfolioFormWithBubbleEffect() {
            const user = JSON.parse(localStorage.getItem('mulmandu_logged_in'));
            if (user) document.getElementById('pf-name').value = user.name || '';
            switchView('form');
        }
        function openPortfolioForm() {
            const user = JSON.parse(localStorage.getItem('mulmandu_logged_in'));
            const p = JSON.parse(localStorage.getItem('mulmandu_portfolios') || '{}')[user.id];
            if (p) {
                document.getElementById('pf-image').value = p.image || '';
                document.getElementById('pf-name').value = p.name || '';
                document.getElementById('pf-job').value = p.job || '';
                document.getElementById('pf-contact').value = p.contact || '';
                document.getElementById('pf-intro').value = p.intro || '';
                document.getElementById('pf-skills').value = p.skills || '';
                document.getElementById('pf-experience').value = p.experience || '';
                document.getElementById('pf-education').value = p.education || '';
                document.getElementById('pf-projects').value = p.projects || '';
            }
            switchView('form');
        }
        function cancelPortfolioForm() {
            const user = JSON.parse(localStorage.getItem('mulmandu_logged_in'));
            const p = JSON.parse(localStorage.getItem('mulmandu_portfolios') || '{}')[user.id];
            if (p) { renderPortfolio(p); switchView('portfolio-view'); } else { switchView('welcome'); }
        }
        function handleSavePortfolio(e) {
            e.preventDefault();
            const user = JSON.parse(localStorage.getItem('mulmandu_logged_in'));
            const data = {
                image: document.getElementById('pf-image').value.trim(),
                name: document.getElementById('pf-name').value.trim(),
                job: document.getElementById('pf-job').value.trim(),
                contact: document.getElementById('pf-contact').value.trim(),
                intro: document.getElementById('pf-intro').value.trim(),
                skills: document.getElementById('pf-skills').value.trim(),
                experience: document.getElementById('pf-experience').value.trim(),
                education: document.getElementById('pf-education').value.trim(),
                projects: document.getElementById('pf-projects').value.trim()
            };
            let portfolios = JSON.parse(localStorage.getItem('mulmandu_portfolios') || '{}');
            portfolios[user.id] = data;
            localStorage.setItem('mulmandu_portfolios', JSON.stringify(portfolios));
            showModal('포트폴리오가 저장되었습니다! ✨', () => { renderPortfolio(data); switchView('portfolio-view'); });
        }
        function renderPortfolio(p) {
            const img = document.getElementById('view-profile-img');
            if (p.image) { img.src = p.image; img.style.display = 'block'; } else { img.style.display = 'none'; }
            document.getElementById('view-name').innerText = p.name;
            document.getElementById('view-job').innerText = p.job;
            document.getElementById('view-intro').innerText = p.intro;
            document.getElementById('view-contact').innerText = p.contact;
            document.getElementById('view-experience').innerText = p.experience || '미입력';
            document.getElementById('view-education').innerText = p.education || '미입력';
            document.getElementById('view-projects').innerText = p.projects || '미입력';
            const tags = document.getElementById('view-skills-tags');
            tags.innerHTML = '';
            if (p.skills) {
                p.skills.split(',').forEach(s => {
                    const tag = document.createElement('span');
                    tag.className = 'tag'; tag.innerText = s.trim();
                    tags.appendChild(tag);
                });
            }
        }
        function handleLogout() {
            localStorage.removeItem('mulmandu_logged_in');
            switchView('login');
        }
        window.onload = function() {
            initBubbles();
            const user = localStorage.getItem('mulmandu_logged_in');
            if (user) { checkUserSession(JSON.parse(user)); } else { switchView('login'); }
        };
    </script>
</body>
</html>
